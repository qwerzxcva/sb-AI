name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.1)'
        required: true
        type: string
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false

env:
  LIBBOX_VERSION: v1.14.2-lx.11

# 创建 Release 需要 contents: write 权限（默认是 read，会导致 softprops 步骤 403 失败）
permissions:
  contents: write

# 防止同一 ref 的多次触发并发运行导致 release 创建冲突
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Fetch libbox core
        run: bash scripts/fetch-libbox.sh
        continue-on-error: true

      - name: Verify libbox.aar exists
        run: |
          if [ ! -f app/libs/libbox.aar ]; then
            echo "❌ libbox.aar not found after fetch script"
            exit 1
          fi
          echo "✓ libbox.aar found ($(du -h app/libs/libbox.aar | cut -f1))"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify ABI
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          unzip -l "$APK" | grep 'arm64-v8a' | head -5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Release ${{ github.event.inputs.version || github.ref_name }}
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          body: |
            ## sb-AI ${{ github.event.inputs.version || github.ref_name }}

            ### 本次修复
            - **VPN 启动无效根因修复**：:core 进程 StateFlow 不跨进程共享导致状态恒为「已停止」，现以 CommandClient 连接状态为真源
            - **UI 卡顿优化**：节点过滤缓存、配置异步落盘、减少不必要重组
            - **订阅导入**：保存后自动刷新 + 错误信息中文化
            - **设置页精简**：资源管理默认折叠
            - **节点管理**：合并到订阅源内展开显示

            ### Downloads
            - **Release APK**：生产构建

            ### Technical Details
            - Core: sing-box-lx ${{ env.LIBBOX_VERSION }}
            - Architecture: arm64-v8a only
            - Min SDK: 26 (Android 8.0)
            - Target SDK: 34 (Android 14)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
