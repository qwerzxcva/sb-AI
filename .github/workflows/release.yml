name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.1)'
        required: true
        type: string
      draft:
        description: 'Create draft release'
        required: false
        type: boolean
        default: false

env:
  LIBBOX_VERSION: v1.14.2-lx.11

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Fetch libbox core
        run: bash scripts/fetch-libbox.sh
        continue-on-error: true

      - name: Verify libbox.aar exists
        run: |
          if [ ! -f app/libs/libbox.aar ]; then
            echo "❌ libbox.aar not found after fetch script"
            exit 1
          fi
          echo "✓ libbox.aar found ($(du -h app/libs/libbox.aar | cut -f1))"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify ABI
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          unzip -l "$APK" | grep 'arm64-v8a' | head -5

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: '*.apk'
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Release ${{ github.event.inputs.version || github.ref_name }}
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          body: |
            ## sb-AI ${{ github.event.inputs.version || github.ref_name }}

            ### Features
            - URLTest 节点测速
            - 订阅自动更新
            - 多配置 Profiles
            - 广播控制 (ADB)
            - 资源管理
            - lxbox 内核支持

            ### Downloads
            - **Release APK**: Production build

            ### Technical Details
            - Core: sing-box-lx ${{ env.LIBBOX_VERSION }}
            - Architecture: arm64-v8a only
            - Min SDK: 26 (Android 8.0)
            - Target SDK: 34 (Android 14)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
