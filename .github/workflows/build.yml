name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.1)'
        required: false
        type: string

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  LIBBOX_VERSION: v1.14.2-lx.11

# 手动触发 release 时需要写权限
permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Fetch libbox core (sing-box-lx)
        run: bash scripts/fetch-libbox.sh
        continue-on-error: true

      - name: Verify libbox.aar exists
        run: |
          if [ ! -f app/libs/libbox.aar ]; then
            echo "❌ libbox.aar not found after fetch script"
            exit 1
          fi
          echo "✓ libbox.aar found ($(du -h app/libs/libbox.aar | cut -f1))"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 防「声称改了实际没提交」：只检查 tracked 文件的改动。
      # 必须忽略 untracked —— 上游 fetch-libbox.sh 会生成 app/libs/(被 gitignore)，
      # 若把 untracked 也算进来，本步骤在 CI 上必然误报。
      - name: Verify no uncommitted changes
        run: |
          DIRTY=$(git status --porcelain --untracked-files=no)
          if [ -n "$DIRTY" ]; then
            echo "::error::Uncommitted changes to tracked files:"
            echo "$DIRTY"
            exit 1
          fi
          echo "✓ no uncommitted changes to tracked files"

      # 防「产物被误提交」：libbox.aar 等大体积内核产物必须由 .gitignore 忽略。
      # 注意：gradle-wrapper.jar / classes.jar 是合法 tracked 文件，故只校验 app/libs 下的产物。
      - name: Verify no build artifacts are tracked
        run: |
          TRACKED=$(git ls-files 'app/libs/*.aar' 'app/libs/*.jar' '*.apk')
          if [ -n "$TRACKED" ]; then
            echo "::error::Build artifacts must not be tracked: $TRACKED"
            exit 1
          fi
          echo "✓ no stray build artifacts tracked"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn

      # 静态门禁：lint 错误一律失败，warning 由 lint-baseline.xml 收口。
      # 新增未基线化的 warning 会在这里暴露，防止代码质量无声劣化。
      - name: Run lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify ABI (arm64-v8a only)
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          unzip -l "$APK" | grep -E '^\s+[0-9]+.*lib/' | awk '{print $4}' | cut -d/ -f2 | sort -u > /tmp/abis.txt
          cat /tmp/abis.txt
          test "$(cat /tmp/abis.txt)" = "arm64-v8a"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sb-AI-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Build debug APK
        if: success()
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sb-AI-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: sb-AI-release

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: sb-AI-debug

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.apk
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Release ${{ github.event.inputs.version || github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          body: |
            ## sb-AI ${{ github.event.inputs.version || github.ref_name }}

            ### ✨ 液态玻璃 UI
            - 全新液态玻璃磨砂效果底栏（RenderEffect 硬件加速）
            - 玻璃质感卡片和分组容器
            - 滑动时动态模糊质量调节，保持流畅

            ### 🚀 核心功能
            - URLTest 节点测速
            - 订阅自动更新
            - 多配置 Profiles
            - 广播控制 (ADB)
            - 资源管理

            ### 📥 下载
            - **Release APK**: 生产构建（体积更小）
            - **Debug APK**: 调试构建（包含调试信息）

            ### 🔧 技术细节
            - Core: sing-box-lx ${{ env.LIBBOX_VERSION }}
            - Architecture: arm64-v8a only
            - Min SDK: 26 (Android 8.0)
            - Target SDK: 34 (Android 14)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
