# sb-AI 构建优化（Android arm64-v8a 单架构）
# 说明：原配置 parallel=false + daemon=false + SerialGC + 1G 堆，编译极慢。
# 这里按容器/CI 与本地开发兼顾的方式调整。

org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Kotlin 增量编译 + 配置缓存下的守护进程
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true
android.builder.sdkDownload=false
# 仅 arm64-v8a：禁用其它 ABI 的 externalNativeBuild 变体，减少配置时间
android.enableJetifier=false
# 资源压缩/R8 优化见 buildTypes
